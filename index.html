<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elmiran Portfolio</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.4.0/remixicon.css">
<style>
body{margin:0;font-family:Arial,sans-serif;background:#e5e5e5;color:#111}
.page{max-width:1100px;margin:25px auto;background:#f4f4f4;min-height:650px;padding:25px 50px;box-shadow:0 8px 30px #999}
nav{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:bold}
.nav-links a{text-decoration:none;color:#111;margin:0 18px;font-size:14px}
.nav-links a.active{border-bottom:2px solid #111;padding-bottom:5px}
.contact-btn{background:#111;color:white!important;padding:14px 22px}
.hero{display:flex;align-items:center;justify-content:space-between;margin-top:90px;gap:60px}
.hero-text{width:50%}
.hero-text h1{font-size:58px;margin:0 0 20px}
.hero-text p{font-size:18px;line-height:1.5}
.highlight{background:#d77b52;padding:2px 6px;font-weight:bold}
.hero-img{position:relative}
.hero-img img{width:320px;height:420px;object-fit:cover}
.frame{position:absolute;right:-18px;bottom:-18px;width:320px;height:420px;border:6px solid #111;z-index:-1}
.socials{position:absolute;right:-70px;top:130px;display:flex;flex-direction:column;gap:12px}
.socials a{background:#555;color:white;text-decoration:none;padding:10px;font-size:20px}
@media(max-width:800px){
.page{margin:0;padding:20px}
nav{flex-direction:column;gap:20px}
.hero{flex-direction:column}
.hero-text{width:100%}
.hero-text h1{font-size:42px}
.socials{position:static;flex-direction:row;margin-top:15px}
}
</style>
</head>
<body>

<div class="page">
<nav>
  <div class="logo">● Elmiran</div>
  <div class="nav-links">
    <a class="active" href="index.html">Home</a>
    <a href="index.html">About Me</a>
    <a href="projects.html">Projects</a>
    <a href="cv.html">CV</a>
    <a class="contact-btn" href="contact.html">Contact Me</a>
  </div>
</nav>

<section class="hero">
  <div class="hero-text">
    <h1>Elmiran</h1>
    <p>
      <span class="highlight">Electrical Engineer</span>, with knowledge in systems,
      programming, and technical projects. I build practical engineering solutions
      and present my work through this portfolio.
    </p>
  </div>

  <div class="hero-img">
    <img src="assets/img/profile.jpg" alt="Elmiran profile photo">
    <div class="frame"></div>

    <div class="socials">
      <a href="https://www.linkedin.com/in/YOUR-LINKEDIN" target="_blank"><i class="ri-linkedin-box-fill"></i></a>
      <a href="mailto:your.email@gmail.com"><i class="ri-mail-fill"></i></a>
      <a href="https://github.com/YOUR-GITHUB" target="_blank"><i class="ri-github-fill"></i></a>
    </div>
  </div>
</section>
</div>

</body>
</html>
