<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Elmiran Kaso</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.4.0/remixicon.css">

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#e5e5e5;
    color:#111;
}

.page{
    max-width:1100px;
    margin:25px auto;
    background:#f4f4f4;
    min-height:650px;
    padding:25px 50px;
    box-shadow:0 8px 30px #999;
}

/* NAVIGATION */

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:50px;
}

.logo{
    font-weight:bold;
    font-size:18px;
}

.nav-links a{
    text-decoration:none;
    color:#111;
    margin:0 18px;
    font-size:15px;
}

.nav-links a.active{
    border-bottom:2px solid #111;
    padding-bottom:5px;
}

.contact-btn{
    background:#111;
    color:white!important;
    padding:14px 22px;
}

/* PAGE TITLE */

h1{
    font-size:55px;
    font-weight:400;
    margin-bottom:40px;
}

/* CONTACT BOX */

.contact-box{
    background:white;
    padding:40px;
    box-shadow:0 5px 20px #bbb;
    max-width:700px;
    border-radius:6px;
}

/* CONTACT ITEMS */

.contact-item{
    display:flex;
    align-items:center;
    gap:18px;
    margin-bottom:28px;
    font-size:20px;
}

.contact-item i{
    font-size:30px;
    color:#b000b5;
    min-width:35px;
}

.contact-item strong{
    min-width:120px;
}

.contact-item a{
    text-decoration:none;
    color:#111;
    transition:0.3s;
}

.contact-item a:hover{
    color:#b000b5;
}

/* MOBILE */

@media(max-width:800px){

    .page{
        margin:0;
        padding:20px;
    }

    nav{
        flex-direction:column;
        gap:20px;
    }

    .nav-links{
        display:flex;
        flex-wrap:wrap;
        justify-content:center;
        gap:12px;
    }

    .nav-links a{
        margin:0;
    }

    h1{
        font-size:42px;
    }

    .contact-box{
        padding:25px;
    }

    .contact-item{
        flex-direction:column;
        align-items:flex-start;
        gap:8px;
        font-size:18px;
    }

}

</style>
</head>

<body>

<div class="page">

<nav>

    <div class="logo">● Elmiran Kaso</div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About Me</a>
        <a href="projects.html">Projects</a>
        <a href="cv.html">CV</a>
        <a class="active contact-btn" href="contact.html">Contact Me</a>
    </div>

</nav>

<h1>Contact Me</h1>

<div class="contact-box">

    <!-- PHONE -->

    <div class="contact-item">
        <i class="ri-phone-fill"></i>

        <strong>Phone:</strong>

        <a href="tel:+41762259143">
            +41 76 225 91 43
        </a>
    </div>

    <!-- EMAIL -->

    <div class="contact-item">
        <i class="ri-mail-fill"></i>

        <strong>E-mail:</strong>

        <a href="mailto:kasoelmiran@gmail.com">
            kasoelmiran@gmail.com
        </a>
    </div>

    <!-- LINKEDIN -->

    <div class="contact-item">
        <i class="ri-linkedin-box-fill"></i>

        <strong>LinkedIn:</strong>

        <a href="https://www.linkedin.com/in/elmiran-kaso/" target="_blank">
            linkedin.com/in/elmiran-kaso
        </a>
    </div>

    <!-- GITHUB -->

    <div class="contact-item">
        <i class="ri-github-fill"></i>

        <strong>GitHub:</strong>

        <a href="https://github.com/kasoelmiran" target="_blank">
            github.com/kasoelmiran
        </a>
    </div>

    <!-- ADDRESS -->

    <div class="contact-item">
        <i class="ri-map-pin-2-fill"></i>

        <strong>Address:</strong>

        <span>
            Poststrasse 12, 8957 Spreitenbach, Aargau, Switzerland
        </span>
    </div>

</div>

</div>

</body>
</html>
